# One-time environment setup: creates schemas, grants and metadata tables (DDL_Notebook),
# then seeds the metadata tables (Seed_Metadata). Run manually once per environment.
resources:
  jobs:
    setup_metadata:
      name: ict_setup_metadata
      max_concurrent_runs: 1

      # Classic job cluster (no serverless), defined once in databricks.yml (var.job_cluster).
      job_clusters:
        - job_cluster_key: setup_cluster
          new_cluster: ${var.job_cluster}

      tasks:
        - task_key: ddl
          job_cluster_key: setup_cluster
          notebook_task:
            notebook_path: ../src/Utilities/DDL_Notebook.ipynb
            base_parameters:
              catalog_name: ${var.catalog}
              group_name: ${var.group_name}

        - task_key: seed_metadata
          depends_on:
            - task_key: ddl
          job_cluster_key: setup_cluster
          notebook_task:
            notebook_path: ../src/Utilities/Seed_Metadata.ipynb
            base_parameters:
              catalog_name: ${var.catalog}
